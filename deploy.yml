# what the cd pipeline publishes + where to. a universe is one experience on roblox, each of its places is this code
# built with its own switches. another place is another entry under `places`, another game another under `universes`
#
# every run builds all of it before publishing any of it. a universe or a place that has no id on roblox yet is
# written with an id of 0: it's built with the rest so it can't rot, then skipped
#
# the ids aren't secrets. the open cloud key that publishes a universe is: `api_key_env` names the env variable it's
# read from, which is a secret of the workflow (and a line of .env to publish from a terminal)
#
# `env` is what the build scripts are run with, the same variables they take from a terminal (GAME, MODE, MAP,
# PROJECT_NAME, any flag of the build config). a universe that names no GAME is shl2. a place adds its own to those of
# its universe. on top of that every build is handed UNIVERSE_ID, PLACE_ID + the id of each place of its universe as
# <NAME>_PLACE_ID, so one place can send players to another without any of them being written down twice. a terminal
# gets all of it for one place from scripts/proj/env.lune.luau
#
# what's built here goes without the stories + the specs of the code, nobody opens one in a place that's live. a place
# that wants them all the same has STORIES_ENABLED: true in its `env`
universes:
  shl2:
    universe_id: 197125125
    api_key_env: PUBLISH_ROBLOX_API_KEY
    env:
      PROJECT_NAME: superhero-life-2
      MAP: roblox-city
    places:
      # the place players land in
      root:
        place_id: 508693446
        version_type: published # "saved" uploads a version without putting it live
        env:
          MODE: combat
      roleplay:
        place_id: 718655742
        version_type: published
        env:
          MODE: roleplay
      # where every custom server is reserved, whoever sets one up picks what it plays by
      private-server:
        place_id: 907988423
        version_type: published
        env:
          MODE: private-server

  shl3:
    universe_id: 0 # built with the rest, published by none until its saves can be brought over
    api_key_env: PUBLISH_ROBLOX_API_KEY
    env:
      GAME: shl3
      PROJECT_NAME: superhero-life-3
      MAP: valor-city
      # this game has no energy + no quests, a power only ever waits out its cooldown
      ENERGY_ENABLED: false
      QUESTS_ENABLED: false
    places:
      # the place players land in. a private server is roblox's own here, there's no third place for one
      root: # the legacy game had it at 2015093382
        place_id: 0
        env:
          MODE: combat
      roleplay: # the legacy game had it at 2466832220
        place_id: 0
        env:
          MODE: roleplay
