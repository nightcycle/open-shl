[creator]
type = "group"
id = 4181328

[codegen]
output_name = "Asset"
typescript = false
style = "nested"
strip_extension = true

# every kind of asset is kept the same way: core holds what more than one game has a use for, shl-1, shl-2 + shl-3
# what only that game does. a file moves to core in the change that gives a second game a use for it, its key in
# Generated follows the folders (Image.core.ui[...], Image["shl-2"].tools[...])
#
# asphalt uploads whatever the path of an input takes + a locked sync fails on a file of it that has no upload yet, a
# line in the table below doesn't change that. so the path takes core + shl-2, and the folders of the legacy games
# (shl-1, shl-3) are left out of it: a file of theirs that moves to core has to be uploaded with that change.
# the braces stay whatever is in them, a key starts at the first folder the path doesn't spell out:
# "asset/image/shl-2/**" would write the keys of that folder without their shl-2
[inputs.Image]
path = "asset/image/{core,shl-2}/**"
output_path = "Generated"

# the images of the legacy games are files under asset/image/shl-1 + asset/image/shl-3 that haven't been uploaded for
# the creator above. each one stands for the upload its legacy game made of it (asset/legacy-ids.tsv), or for the
# creator's own where the same bytes went up before, which is all its key in Generated/Image takes. to upload a folder
# of them: add it to the path above, take its lines out of this table + sync the assets to the cloud.
# scripts/util/import-images.lune.luau keeps the table, in order
[inputs.Image.web]
